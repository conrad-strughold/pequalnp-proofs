name: OpenSwarm tests
on:
  push:
    branches: [openswarm-platform]
    paths: ['swarm/**', '.github/workflows/swarm-tests.yml']
  pull_request:
    paths: ['swarm/**', '.github/workflows/swarm-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s swarm -p 'test_*.py' -v
      - run: python -m compileall -q swarm
      - run: docker build -t openswarm-test swarm
